---
services:
  web-application:
    container_name: ex-web-app
    image: nginxdemos/hello:latest
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-net # This is optional, only used if there are multiple Traefik docker networks
      - traefik.http.routers.example-http.rule=Host(`example.surajram.online`) # Select a hostname for routing
      - traefik.http.routers.example-http.entrypoints=web # Pick a entrypoint
      - traefik.http.routers.example-https.rule=Host(`example.surajram.online`)
      - traefik.http.routers.example-https.tls=true
      - traefik.http.routers.example-https.tls.certresolver=my-resolver
      - traefik.http.routers.example-https.entrypoint=websecure
    networks:
      - traefik-net
# Attach to Traefik
networks:
  traefik-net:
    external: true
