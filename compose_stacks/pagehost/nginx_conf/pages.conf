# Serves published pages. MCP is not on this port; compose publishes it
# directly from the app container.
# Pages:  <PAGEHOST_BASE_URL>/p/<id>/
# Assets: <PAGEHOST_BASE_URL>/_assets/pagehost.css
# Root:   <PAGEHOST_BASE_URL>/  lists the page directories (nginx autoindex)
#
# The sites volume is mounted read-only at /srv/pages. One directory per page id.
# Stock autoindex has no exclude list, so _assets is listed next to the page ids.
# A deleted page leaves its directory on disk, so it stays in this list.

server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;

    # allow 10.0.0.0/8;  deny all;      # restrict to the VPC / VPN in production

    # Listing for /. index is a name that is never written, so a stray index.html
    # cannot replace the directory list. Links are /<id>/, which the next location
    # sends to the published page.
    location = / {
        root /srv/pages;
        index disabled;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/pagehost-security.conf;
    }

    # Top-level directory name from the listing. Not /p/<id>, and not a version path.
    # Relative Location keeps the public host and port. Nginx listens on 80 in the
    # container, so an absolute redirect would drop the published port.
    location ~ '^/([a-z0-9][a-z0-9-]{2,62})/?$' {
        absolute_redirect off;
        return 302 /p/$1/;
    }

    location ^~ /_assets/ {
        alias /srv/pages/_assets/;
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/snippets/pagehost-security.conf;
    }

    # /p/<id>, /p/<id>/, and /p/<id>/index.html. current/ is a symlink to the live version.
    # rewrite stays in this location so the security headers apply to the file it serves.
    # Copy the capture before rewrite: rewrite replaces $1.
    location ~ '^/p/([a-z0-9][a-z0-9-]{2,62})(?:/(?:index\.html)?)?$' {
        include /etc/nginx/snippets/pagehost-security.conf;
        add_header Cache-Control "no-cache" always;
        set $page_id $1;
        root /srv/pages/$page_id/current;
        rewrite ^ /index.html break;
    }
}
