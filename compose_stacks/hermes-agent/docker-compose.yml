services:
  hermes:
    image: nousresearch/hermes-agent:v2026.9.24
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    volumes:
      - /mnt/user/appdata/hermes:/opt/data
    environment:
      TZ: America/New_York
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_BASIC_AUTH_SECRET}
      # Browser origin for the Traefik route. The image binds the dashboard
      # on 0.0.0.0, so Traefik on traefik-net can reach 9119.
      HERMES_DASHBOARD_PUBLIC_URL: https://hermes.surajram.online
      # The API server defaults to 127.0.0.1, which Traefik cannot reach.
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_KEY: ${API_SERVER_KEY}
    # Neither port is published. Traefik reaches 9119 and 8642 on traefik-net.
    # The healthcheck uses the container's own loopback.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://127.0.0.1:9119/api/health >/dev/null
          && curl -fsS http://127.0.0.1:9119/api/status
          | grep -Eq '"gateway_running"[[:space:]]*:[[:space:]]*true'
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    # The gateway, its local terminal, and code_execution Python share default.
    # otel-observability-net reaches the collector. traefik-net is the only
    # path to the dashboard and the API server.
    networks:
      - default
      - otel-observability-net
      - traefik-net
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-net
      - traefik.http.routers.hermes.rule=Host(`hermes.surajram.online`)
      - traefik.http.routers.hermes.entrypoints=websecure
      - traefik.http.routers.hermes.tls=true
      - traefik.http.routers.hermes.tls.certresolver=my-resolver
      - traefik.http.routers.hermes.service=hermes
      - traefik.http.services.hermes.loadbalancer.server.port=9119
      - traefik.http.routers.hermesapi.rule=Host(`hermesapi.surajram.online`)
      - traefik.http.routers.hermesapi.entrypoints=websecure
      - traefik.http.routers.hermesapi.tls=true
      - traefik.http.routers.hermesapi.tls.certresolver=my-resolver
      - traefik.http.routers.hermesapi.service=hermesapi
      - traefik.http.services.hermesapi.loadbalancer.server.port=8642
    # not supported in kernel version
    # deploy:
    #   resources:
    #     limits:
    #       memory: 4G
    #       cpus: "2.0"

networks:
  otel-observability-net:
    external: true
    name: otel-observability-net
  traefik-net:
    external: true
