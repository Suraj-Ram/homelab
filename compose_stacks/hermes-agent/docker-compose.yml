services:
  hermes:
    image: nousresearch/hermes-agent:v2026.9.24
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    ports:
      - "8642:8642"
      - "9119:9119"
    volumes:
      - /mnt/user/appdata/hermes:/opt/data
    environment:
      TZ: America/New_York
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_BASIC_AUTH_SECRET}
    # The gateway API binds 127.0.0.1 inside the container, so host port 8642
    # resets. The dashboard on 9119 answers on the host and reports gateway_running.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://127.0.0.1:9119/api/health >/dev/null
          && curl -fsS http://127.0.0.1:9119/api/status
          | grep -Eq '"gateway_running"[[:space:]]*:[[:space:]]*true'
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    # not supported in kernel version
    # deploy:
    #   resources:
    #     limits:
    #       memory: 4G
    #       cpus: "2.0"
