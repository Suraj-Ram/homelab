services:
  redis:
    image: redis:7.4.5-alpine
    container_name: ntopng-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --dir
      - /data
    volumes:
      - /mnt/user/appdata/ntopng/redis:/data
    # Host-networked ntopng reaches Redis on the loopback publish.
    # Keep Redis off the LAN; do not publish 0.0.0.0:16379.
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  ntopng:
    # Hub's ntop/ntopng latest is the stable channel; there is no :stable tag.
    image: ntop/ntopng:latest@sha256:90783fdec644b0b55eef21ed51c64614279e963cd7eca59b9f52717c7a70327c
    container_name: ntopng
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      TZ: America/New_York
      # Override on the NAS if the LAN bridge is not br0 (check: ip -br link).
      NTOPNG_INTERFACE: ${NTOPNG_INTERFACE:-br0}
    volumes:
      - /mnt/user/appdata/ntopng/data:/var/lib/ntopng
    # Community edition. UI on loopback:3009 (3000 is OpenSpeedTest).
    # Redis at host-published 127.0.0.1:16379. Local net matches 10.0.0.51/24.
    command:
      - --community
      - -i
      - ${NTOPNG_INTERFACE:-br0}
      - -w
      - 127.0.0.1:3009
      - -r
      - 127.0.0.1:16379@0
      - -m
      - 10.0.0.0/24
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "timeout 5 bash -c ':> /dev/tcp/127.0.0.1/3009' || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
