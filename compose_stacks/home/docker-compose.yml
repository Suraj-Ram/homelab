services:
  home:
    image: nginx:1.30.5-alpine
    container_name: home
    restart: unless-stopped
    volumes:
      # Official image document root. A pull updates these files in place.
      - ./public:/usr/share/nginx/html:ro
    networks:
      - traefik-net
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-net
      - traefik.http.routers.apex.rule=Host(`surajram.online`)
      - traefik.http.routers.apex.entrypoints=websecure
      - traefik.http.routers.apex.tls=true
      - traefik.http.routers.apex.tls.certresolver=my-resolver
      - traefik.http.services.apex.loadbalancer.server.port=80

networks:
  traefik-net:
    external: true
