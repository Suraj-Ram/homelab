services:
  otel-collector:
    image: otel/opentelemetry-collector:0.165.0
    container_name: otel-collector
    restart: unless-stopped
    command:
      - --config=/etc/otelcol/config.yaml
    environment:
      TZ: America/New_York
    volumes:
      - ./config.yaml:/etc/otelcol/config.yaml:ro
    # No ports. Reachable only as otel-collector on the otel network.
    # gRPC 4317, HTTP 4318, health_check 13133. Logs only.
    networks:
      - otel
    depends_on:
      - loki
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  loki:
    image: grafana/loki:3.7.9
    container_name: loki
    restart: unless-stopped
    user: "99:100"
    command:
      - -config.file=/etc/loki/config.yaml
    environment:
      TZ: America/New_York
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml:ro
      - /mnt/user/appdata/loki:/loki
    # Query API for the Unraid Grafana container, which is not on this network.
    # Bound to the LAN address so it is not also listening on the Tailscale address.
    # The collector writes over the otel network and does not use this port.
    ports:
      - "10.0.0.51:3100:3100"
    networks:
      - otel
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  otel:
    external: true
    name: otel
