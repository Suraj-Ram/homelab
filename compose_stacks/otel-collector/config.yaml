# Log ingest for containers on the otel network. The collector publishes no ports.
# It listens on 0.0.0.0 inside the container because the image defaults to localhost.
# There is no traces pipeline and no metrics pipeline. Those signals are refused.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # First in the pipeline. Unraid does not enforce Compose memory limits.
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 5s
    send_batch_size: 1024

exporters:
  # Loki's native OTLP endpoint. The exporter appends /v1/logs.
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/loki]
