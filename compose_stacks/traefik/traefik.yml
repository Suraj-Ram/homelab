global:
  sendAnonymousUsage: false
  checkNewVersion: false

log:
  level: DEBUG

api:
  dashboard: true
  insecure: true

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    transport:
      respondingTimeouts:
        # OpenSpeedTest posts up to 35MB. The default 60s cuts a slow upload.
        readTimeout: 180s
  
certificatesResolvers:
  my-resolver:
    acme:
      email: email@surajram.online
      storage: /var/traefik/certs/cloudflare-acme.json # this needs to be in a volume
      caServer: https://acme-v02.api.letsencrypt.org/directory
      keyType: EC256
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"

providers:
  docker:
    endpoint: unix:///var/run/docker.sock
    exposedByDefault: false
  file:
    directory: /etc/traefik/dynamic
    watch: true


